<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUXORA — لوحة المدير</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:Arial,Tahoma,sans-serif}
.wrap{max-width:1100px;margin:40px auto;padding:20px}.card{background:#111;border:1px solid #2a2a2a;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0008}
h1{margin-top:0}.gold{color:#e6bd63}label{display:block;margin:16px 0 7px}input,textarea,select{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#090909;color:#fff;font-size:15px}button{border:0;border-radius:12px;padding:13px 20px;cursor:pointer;font-weight:700}.primary{background:#d9ad55;color:#111}.secondary{background:#222;color:#fff}.danger{background:#8e3030;color:#fff}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.msg{margin-top:15px;padding:12px;border-radius:10px;background:#191919}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.product{border:1px solid #292929;border-radius:15px;padding:15px;margin-top:12px;display:flex;justify-content:space-between;gap:15px;align-items:center}.muted{color:#999;font-size:13px}@media(max-width:700px){.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginCard" class="card">
    <div class="muted">LUXORA ADMIN FINAL</div>
    <h1>دخول مدير <span class="gold">LUXORA</span></h1>
    <p class="muted">استخدم حساب Supabase Authentication الذي أنشأته.</p>
    <label>البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="username" placeholder="بريدك الإلكتروني">
    <label>كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="كلمة مرور حساب Supabase">
    <div class="actions">
      <button id="loginBtn" class="primary">تسجيل الدخول</button>
      <button id="resetBtn" class="secondary">إرسال رابط إعادة تعيين كلمة المرور</button>
    </div>
    <div id="loginMsg" class="msg">جاري تهيئة الاتصال...</div>
  </div>

  <div id="app" class="hidden">
    <div class="top">
      <div>
        <div class="muted">LUXORA ADMIN FINAL</div>
        <h1>لوحة التحكم</h1>
        <div id="userEmail" class="muted"></div>
      </div>
      <button id="logoutBtn" class="secondary">تسجيل الخروج</button>
    </div>

    <div class="card">
      <h2>إضافة / تعديل ساعة</h2>
      <input id="editId" type="hidden">
      <div class="row">
        <div><label>اسم الساعة</label><input id="name" placeholder="اسم الساعة"></div>
        <div><label>السعر</label><input id="price" type="number" min="0" placeholder="السعر"></div>
        <div><label>الفئة</label><input id="category" placeholder="رجالي / نسائي / فاخر"></div>
        <div><label>الشارة</label><input id="badge" placeholder="جديد / الأكثر مبيعًا"></div>
        <div><label>المخزون</label><input id="stock" type="number" min="0" value="1"></div>
        <div><label>رابط الصورة</label><input id="image_url" placeholder="https://..."></div>
      </div>
      <label>الوصف</label><textarea id="description" rows="4" placeholder="وصف الساعة"></textarea>
      <div class="actions">
        <button id="saveBtn" class="primary">حفظ في Supabase</button>
        <button id="clearBtn" class="secondary">مسح النموذج</button>
      </div>
      <div id="appMsg" class="msg"></div>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="top"><h2>المنتجات</h2><button id="refreshBtn" class="secondary">تحديث</button></div>
      <div id="products"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const SUPABASE_URL = "https://njuysvxzecgcagqymcxa.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_NY1cA0NQq48beLQclc_E4g_yVhwvVz8";

  const loginCard = document.getElementById("loginCard");
  const app = document.getElementById("app");
  const loginMsg = document.getElementById("loginMsg");
  const appMsg = document.getElementById("appMsg");

  // مهم: لا نستخدم متغيرًا اسمه supabase حتى لا يحدث تعارض مع مكتبة Supabase.
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  function msg(el, text, error=false) {
    el.textContent = text;
    el.style.border = error ? "1px solid #7d3030" : "1px solid #333";
  }

  async function showSession() {
    try {
      const { data, error } = await client.auth.getSession();
      if (error) throw error;
      if (data.session && data.session.user) {
        loginCard.classList.add("hidden");
        app.classList.remove("hidden");
        document.getElementById("userEmail").textContent = data.session.user.email || "";
        await loadProducts();
        return true;
      }
      loginCard.classList.remove("hidden");
      app.classList.add("hidden");
      msg(loginMsg, "أدخل بيانات حساب Supabase.");
      return false;
    } catch (e) {
      msg(loginMsg, "خطأ في فحص الجلسة: " + (e.message || e), true);
      return false;
    }
  }

  client.auth.onAuthStateChange(async (event, session) => {
    if (session && session.user) {
      loginCard.classList.add("hidden");
      app.classList.remove("hidden");
      document.getElementById("userEmail").textContent = session.user.email || "";
      if (event === "SIGNED_IN") await loadProducts();
    } else {
      loginCard.classList.remove("hidden");
      app.classList.add("hidden");
    }
  });

  document.getElementById("loginBtn").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) return msg(loginMsg, "أدخل البريد وكلمة المرور.", true);
    msg(loginMsg, "جاري تسجيل الدخول...");
    const { data, error } = await client.auth.signInWithPassword({ email, password });
    if (error) return msg(loginMsg, "فشل تسجيل الدخول: " + error.message, true);
    if (!data.session) return msg(loginMsg, "تمت المصادقة لكن لم تُنشأ جلسة. تحقق من إعدادات Supabase.", true);
    msg(loginMsg, "تم تسجيل الدخول بنجاح.");
    await showSession();
  };

  document.getElementById("resetBtn").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) return msg(loginMsg, "اكتب البريد الإلكتروني أولًا.", true);
    const redirectTo = location.origin + location.pathname;
    const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });
    if (error) return msg(loginMsg, "فشل إرسال رابط إعادة التعيين: " + error.message, true);
    msg(loginMsg, "تم إرسال رابط إعادة تعيين كلمة المرور إلى البريد.");
  };

  document.getElementById("logoutBtn").onclick = async () => {
    await client.auth.signOut();
    location.reload();
  };

  function formData() {
    return {
      name: document.getElementById("name").value.trim(),
      price: Number(document.getElementById("price").value || 0),
      category: document.getElementById("category").value.trim(),
      badge: document.getElementById("badge").value.trim(),
      stock: Number(document.getElementById("stock").value || 0),
      image_url: document.getElementById("image_url").value.trim(),
      description: document.getElementById("description").value.trim()
    };
  }

  document.getElementById("saveBtn").onclick = async () => {
    const id = document.getElementById("editId").value;
    const payload = formData();
    if (!payload.name) return msg(appMsg, "اكتب اسم الساعة.", true);
    msg(appMsg, "جاري الحفظ...");
    const result = id
      ? await client.from("products").update(payload).eq("id", id)
      : await client.from("products").insert(payload);
    if (result.error) return msg(appMsg, "خطأ في الحفظ: " + result.error.message, true);
    msg(appMsg, "تم الحفظ بنجاح.");
    clearForm();
    await loadProducts();
  };

  function clearForm() {
    ["editId","name","price","category","badge","image_url","description"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("stock").value = "1";
  }
  document.getElementById("clearBtn").onclick = clearForm;
  document.getElementById("refreshBtn").onclick = loadProducts;

  window.editProduct = (p) => {
    document.getElementById("editId").value = p.id || "";
    document.getElementById("name").value = p.name || "";
    document.getElementById("price").value = p.price ?? "";
    document.getElementById("category").value = p.category || "";
    document.getElementById("badge").value = p.badge || "";
    document.getElementById("stock").value = p.stock ?? 0;
    document.getElementById("image_url").value = p.image_url || "";
    document.getElementById("description").value = p.description || "";
    window.scrollTo({top:0, behavior:"smooth"});
  };

  window.deleteProduct = async (id) => {
    if (!confirm("هل تريد حذف هذه الساعة؟")) return;
    const { error } = await client.from("products").delete().eq("id", id);
    if (error) return msg(appMsg, "خطأ في الحذف: " + error.message, true);
    msg(appMsg, "تم الحذف.");
    await loadProducts();
  };

  async function loadProducts() {
    const box = document.getElementById("products");
    box.innerHTML = "جاري تحميل المنتجات...";
    const { data, error } = await client.from("products").select("*").order("created_at", {ascending:false});
    if (error) {
      box.innerHTML = "";
      return msg(appMsg, "خطأ في قراءة المنتجات: " + error.message, true);
    }
    if (!data || !data.length) {
      box.innerHTML = '<div class="muted">لا توجد منتجات بعد.</div>';
      return;
    }
    box.innerHTML = data.map(p => `
      <div class="product">
        <div>
          <strong>${escapeHtml(p.name || "بدون اسم")}</strong>
          <div class="muted">${Number(p.price || 0).toLocaleString("ar-DZ")} دج — المخزون: ${p.stock ?? 0}</div>
        </div>
        <div class="actions">
          <button class="secondary" onclick='editProduct(${JSON.stringify(p).replace(/'/g,"&#39;")})'>تعديل</button>
          <button class="danger" onclick="deleteProduct('${String(p.id).replace(/'/g,"\\'")}')">حذف</button>
        </div>
      </div>`).join("");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }

  showSession();
})();
</script>
</body>
</html>
